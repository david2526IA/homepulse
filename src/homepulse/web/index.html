<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomePulse</title><style>
body{max-width:820px;margin:0 auto;padding:48px 20px;font-family:system-ui;background:#08131a;color:#e8f4f3} section{margin-top:22px;padding:22px;border:1px solid #28515a;border-radius:14px;background:#0e2028}button,input{font:inherit;padding:11px;border-radius:8px}button{background:#53d3b6;border:0;font-weight:700}pre{white-space:pre-wrap;overflow:auto;color:#c8ddd9}.muted{color:#a8bfbb}</style></head>
<body><h1>HomePulse</h1><p class="muted">Understand household consumption locally. Upload CSV; no account required.</p><section><h2>Analyse energy usage</h2><input id="file" type="file" accept=".csv"><button onclick="run()">Generate report</button><pre id="result"></pre></section><script>async function run(){const f=document.getElementById('file').files[0];if(!f)return;const form=new FormData();form.append('upload',f);const r=await fetch('/v1/analyse',{method:'POST',body:form});document.getElementById('result').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
